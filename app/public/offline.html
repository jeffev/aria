<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1d2e" />
    <title>ARIA — sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0f1117;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      img { height: 64px; }
      p { color: #8892b0; font-size: 14px; line-height: 1.6; max-width: 320px; }
      button {
        margin-top: 8px;
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/aria-icon.svg" alt="ARIA" />
      <h1 style="font-size: 20px; margin: 16px 0 8px">Sem conexão</h1>
      <p>A ARIA precisa de internet para mostrar sua agenda, tarefas e notas. Assim que a conexão voltar, é só tentar de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
